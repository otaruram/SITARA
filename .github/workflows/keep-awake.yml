name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier from sleeping (15 min inactivity limit)
    - cron: '*/12 * * * *'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Render Backend URL (e.g. https://sitara-backend.onrender.com)'
        required: false
        default: ''

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET_URL="${{ inputs.backend_url || secrets.RENDER_BACKEND_URL || 'https://sitara-be.onrender.com' }}"
          echo "Sending keep-alive ping to $TARGET_URL/api/health ..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/api/health" || true)
          echo "Health check response code: $STATUS_CODE"

